<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>SECRET TERMINAL</title>

<style>

body{
    background:black;
    color:#00ff88;
    font-family:monospace;
    text-align:center;
    padding-top:100px;
}

input, button{
    background:black;
    color:#00ff88;
    border:2px solid #00ff88;
    padding:10px;
    font-family:monospace;
}

#adminNotice{
    color:red;
    animation:flicker 0.3s infinite;
}

@keyframes flicker{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

</style>

</head>

<body>

<h1>SECRET TERMINAL</h1>

<h2 id="adminNotice">
SYSTEM NOTICE: ADMIN HAS REDIRECTED YOU HERE
</h2>

<h2 id="adminNotice">
HINT: UNLOCK THE SYSTEM ACCESS
</h2>

<p>ENTER CODE BELOW</p>

<input id="code" placeholder="introduce clave..." />

<button onclick="check()">ENVIAR</button>

<script>

function check(){

    const val =
    document.getElementById("code")
    .value
    .trim()
    .toLowerCase();

    console.log("INPUT:", val);

    if(val === "unlock"){

        console.log("ACCESS GRANTED");

        window.location.href = "index.html";

    } else {

        alert("ACCESO DENEGADO");
    }
}

</script>

</body>
